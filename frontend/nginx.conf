# Serves the console and proxies each service under one origin, so the browser
# needs no CORS and a websocket reaches chat_api without a second host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Each service answers on its own API prefix, which these paths keep.
    location /api/identity/ {
        proxy_pass http://identity:8000;
        include /etc/nginx/snippets/proxy.inc;
    }

    location /api/7r/ {
        proxy_pass http://chat_api:8000;
        include /etc/nginx/snippets/proxy.inc;
    }

    location /api/mcp_server/ {
        proxy_pass http://mcp_server:8000;
        include /etc/nginx/snippets/proxy.inc;
    }

    # Readiness lives outside the prefix, so each service gets a path of its own.
    location /svc/identity/   { proxy_pass http://identity:8000/;   include /etc/nginx/snippets/proxy.inc; }
    location /svc/chat_api/   { proxy_pass http://chat_api:8000/;   include /etc/nginx/snippets/proxy.inc; }
    location /svc/mcp_server/ { proxy_pass http://mcp_server:8000/; include /etc/nginx/snippets/proxy.inc; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
