name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - run: uv lock --check
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - name: Architectural boundaries
        run: uv run python tools/boundary_lint.py
      - name: Dependency isolation
        run: uv run python tools/deps_lint.py
      - name: Composed single service
        # Slices must stay composable into one deployment, not just runnable
        # as separate services. Generated fresh rather than committed, so the
        # reference services remain the only copy of this code.
        run: |
          uv run python tools/new_service.py --name composed --from identity,chat_api
          uv lock
          uv run ruff check services/composed
          uv run python tools/boundary_lint.py
          uv run python tools/deps_lint.py
          UV_PROJECT_ENVIRONMENT=.venvs/composed uv sync --locked --package composed
          cd services/composed && SQL_BACKEND=postgresql BROKER=memory \
            ../../.venvs/composed/bin/python -c "
          from composed.app import app
          paths = {r.path for r in app.routes}
          assert any(p.endswith('/auth/login') for p in paths), 'auth slice missing'
          assert any('conversations' in p for p in paths), 'chat slice missing'
          from composed.models.orm import ComposedBase
          for m in ('user', 'conversation', 'outbox'):
              __import__(f'composed.models.orm.{m}')
          tables = {str(t) for t in ComposedBase.metadata.tables}
          assert 'user' in tables and 'conversation' in tables, tables
          assert sum(t == 'outbox_event' for t in tables) == 1, 'outbox not merged'
          print(f'composed service OK: {len(paths)} routes, {len(tables)} tables')
          "
          git checkout -- uv.lock && rm -rf services/composed .venvs/composed

  detect:
    name: Affected services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - id: affected
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          echo "services=$(uv run python tools/affected.py --base "$BASE")" >> "$GITHUB_OUTPUT"

  service:
    name: ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - name: Install only this service
        run: uv sync --package ${{ matrix.service }}
        env:
          UV_PROJECT_ENVIRONMENT: .venvs/${{ matrix.service }}
      - name: Build image
        run: |
          docker build -f docker/service.Dockerfile \
            --build-arg SERVICE=${{ matrix.service }} \
            -t ${{ matrix.service }}:${{ github.sha }} .
      - name: Entrypoint imports inside the image
        # Images ship without the dev-only SQLite driver, so probe the backend
        # the image is actually built for.
        run: |
          docker run --rm \
            --workdir /app/services/${{ matrix.service }} \
            --env SQL_BACKEND=postgresql \
            --entrypoint python \
            ${{ matrix.service }}:${{ github.sha }} \
            -c "from importlib.metadata import entry_points; eps = list(entry_points(group='console_scripts', name='serve')); assert eps, 'service declares no serve entry point'; [ep.load() for ep in eps]; print('entrypoint imports cleanly')"
      - name: Preflight inside the image
        run: |
          docker run --rm \
            --workdir /app/services/${{ matrix.service }} \
            --env SQL_BACKEND=postgresql --env BROKER=redis \
            --entrypoint python \
            ${{ matrix.service }}:${{ github.sha }} -m base.preflight
      - name: Image rejects configuration it cannot honour
        run: |
          for bad in "SQL_BACKEND=mysql" "BROKER=Redis"; do
            if docker run --rm \
              --workdir /app/services/${{ matrix.service }} \
              --env SQL_BACKEND=postgresql --env BROKER=redis --env "$bad" \
              --entrypoint python \
              ${{ matrix.service }}:${{ github.sha }} -m base.preflight; then
              echo "preflight accepted $bad, which this image cannot honour"; exit 1
            fi
          done
      - name: No secrets in image
        run: |
          LEAKED=$(docker run --rm --entrypoint sh ${{ matrix.service }}:${{ github.sha }} -c \
            'find /app -path /app/.venv -prune -o \( -name ".env" -o -name "*.pem" -o -name "*.key" \) -not -name "*.example" -print 2>/dev/null' || true)
          if [ -n "$LEAKED" ]; then echo "secret material in image:"; echo "$LEAKED"; exit 1; fi
