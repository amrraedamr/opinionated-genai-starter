name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, because the live tier talks to providers that change under us
    # rather than to code that changed here.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - run: uv lock --check
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - name: Formatting
        # Checked, not applied: drift accumulates silently otherwise, and a
        # later broad format then buries real changes under reflowed lines.
        run: uv run ruff format --check .
      - name: Architectural boundaries
        run: uv run python tools/boundary_lint.py
      - name: Dependency isolation
        run: uv run python tools/deps_lint.py
      - name: Imports
        # Every extra installed on purpose: a module behind an extra no shipped
        # service declares is never loaded by the per-service jobs, so a stale
        # import inside it would otherwise reach main unnoticed.
        run: |
          uv sync --all-extras --all-packages
          uv run --no-sync python tools/import_lint.py
      - name: Unit tests
        # No containers and no credentials here, so the integration and live
        # tiers skip themselves. The unit tier covers every backend and every
        # provider by asserting on what they build rather than what they reach.
        run: uv run --no-sync pytest tests/unit -q

      - name: Composed single service
        # Slices must stay composable into one deployment, not just runnable
        # as separate services. Generated fresh rather than committed, so the
        # reference services remain the only copy of this code.
        run: |
          uv run python tools/new_service.py --name composed --from identity,chat_api
          uv lock
          uv run ruff check services/composed
          uv run python tools/boundary_lint.py
          uv run python tools/deps_lint.py
          UV_PROJECT_ENVIRONMENT="$PWD/.venvs/composed" uv sync --locked --package composed
          ( cd services/composed && SQL_BACKEND=postgresql BROKER=memory \
            "$GITHUB_WORKSPACE/.venvs/composed/bin/python" -c "
          from composed.app import app
          paths = {r.path for r in app.routes}
          assert any(p.endswith('/auth/login') for p in paths), 'auth slice missing'
          assert any('conversations' in p for p in paths), 'chat slice missing'
          from composed.models.orm import ComposedBase
          for m in ('user', 'conversation', 'outbox'):
              __import__(f'composed.models.orm.{m}')
          tables = {str(t) for t in ComposedBase.metadata.tables}
          assert 'user' in tables and 'conversation' in tables, tables
          assert sum(t == 'outbox_event' for t in tables) == 1, 'outbox not merged'
          print(f'composed service OK: {len(paths)} routes, {len(tables)} tables')
          " )
          git checkout -- uv.lock
          rm -rf services/composed .venvs/composed

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches deploy/docker-compose.infra.yml: a backend tested against a
        # different image than the one people run locally is tested twice and
        # trusted once.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: local
          POSTGRES_PASSWORD: local
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U local"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mongo:
        # Not 8.x: its bundled TCMalloc cannot start on the kernel these
        # runners ship (SERVER-121912), and no 8.x patch fixes it.
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.0
        # 6333 is REST, 6334 is gRPC, which the client prefers by default.
        ports: ["6333:6333", "6334:6334"]
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        # 10100 matches compose, where Azurite's own 10000 is often taken.
        ports: ["10100:10000"]
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        env:
          PROTOCOL: http
        ports: ["8081:8081"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - run: uv sync --all-extras --all-packages
      - name: Start the tracing stack
        # From the compose file rather than as service containers above. The
        # collector needs its config mounted, and a service container starts
        # before the checkout exists — so the file it would read is not there
        # yet. Running the same compose file also means the tags cannot drift
        # from the ones people run locally, which is the whole point of
        # pinning them.
        run: |
          docker compose -f deploy/docker-compose.infra.yml up -d otel-collector jaeger
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:16686/api/v3/services; then
              echo "jaeger ready"; break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:16686/api/v3/services \
            || { echo "jaeger never answered"; exit 1; }
      - name: Wait for the emulators
        # The Cosmos emulator takes appreciably longer to answer than the
        # databases. Without this the tier would skip itself and pass.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8081/ 2>/dev/null; then
              echo "cosmos ready"; break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8081/ || { echo "cosmos never answered"; exit 1; }
      - name: Integration tests
        run: uv run --no-sync pytest tests/integration -q -rs

  live:
    name: Live providers
    # Not on a pull request: the credentials are repository secrets, and a
    # tier that skips itself on every PR teaches people to ignore it. Nightly
    # and on demand, where a provider changing its API is what this catches.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - run: uv sync --all-extras --all-packages
      - name: Live tests
        # `-rs` on purpose: with no secrets, or behind a gateway this runner
        # cannot resolve, every test skips and the job still passes. The
        # reasons are the output that matters, so they are printed.
        env:
          OPENAI_LLM_ENDPOINT: ${{ secrets.OPENAI_LLM_ENDPOINT }}
          OPENAI_LLM_API_KEY: ${{ secrets.OPENAI_LLM_API_KEY }}
        run: uv run --no-sync pytest tests/live -q -rs

  detect:
    name: Affected services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - id: affected
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          echo "services=$(uv run python tools/affected.py --base "$BASE")" >> "$GITHUB_OUTPUT"

  service:
    name: ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - name: Install only this service
        run: uv sync --package ${{ matrix.service }}
        env:
          UV_PROJECT_ENVIRONMENT: .venvs/${{ matrix.service }}
      - name: Build image
        run: |
          docker build -f docker/service.Dockerfile \
            --build-arg SERVICE=${{ matrix.service }} \
            -t ${{ matrix.service }}:${{ github.sha }} .
      - name: Entrypoint imports inside the image
        # Images ship without the dev-only SQLite driver, so probe the backend
        # the image is actually built for.
        run: |
          docker run --rm \
            --workdir /app/services/${{ matrix.service }} \
            --env SQL_BACKEND=postgresql \
            --entrypoint python \
            ${{ matrix.service }}:${{ github.sha }} \
            -c "from importlib.metadata import entry_points; eps = list(entry_points(group='console_scripts', name='serve')); assert eps, 'service declares no serve entry point'; [ep.load() for ep in eps]; print('entrypoint imports cleanly')"
      - name: Preflight inside the image
        run: |
          docker run --rm \
            --workdir /app/services/${{ matrix.service }} \
            --env SQL_BACKEND=postgresql --env BROKER=redis \
            --entrypoint python \
            ${{ matrix.service }}:${{ github.sha }} -m base.preflight
      - name: Image rejects configuration it cannot honour
        run: |
          for bad in "SQL_BACKEND=mysql" "BROKER=Redis"; do
            if docker run --rm \
              --workdir /app/services/${{ matrix.service }} \
              --env SQL_BACKEND=postgresql --env BROKER=redis --env "$bad" \
              --entrypoint python \
              ${{ matrix.service }}:${{ github.sha }} -m base.preflight; then
              echo "preflight accepted $bad, which this image cannot honour"; exit 1
            fi
          done
      - name: No secrets in image
        run: |
          LEAKED=$(docker run --rm --entrypoint sh ${{ matrix.service }}:${{ github.sha }} -c \
            'find /app -path /app/.venv -prune -o \( -name ".env" -o -name "*.pem" -o -name "*.key" \) -not -name "*.example" -print 2>/dev/null' || true)
          if [ -n "$LEAKED" ]; then echo "secret material in image:"; echo "$LEAKED"; exit 1; fi
