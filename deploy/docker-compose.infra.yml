# Infrastructure only. Services live in docker-compose.yml, which extends this
# file, so day-to-day work does not rebuild containers:
#
#   docker compose -f deploy/docker-compose.infra.yml up -d
#   UV_PROJECT_ENVIRONMENT=.venvs/chat_api uv run --package chat_api serve
name: genai-infra

services:
  postgres:
    # pgvector's image, not plain Postgres: PgVectorSearchService installs the
    # extension itself but cannot conjure it into an image that lacks it.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    # Not 8.x: its bundled TCMalloc refuses to start on Linux kernels 6.19
    # and newer (SERVER-121912), which no 8.x patch resolves.
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      # 6333 is the REST API; 6334 is gRPC, which the client prefers by default.
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  azurite:
    # Blob storage, so AzureBlobService runs against something rather than
    # only being asserted on. Shared key, which is why the client takes one.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    ports:
      # 10100, not Azurite's own 10000: that port is often already taken.
      - "10100:10000"
    volumes:
      - azuritedata:/data

  cosmos:
    # The vNext emulator: native arm64 and plain HTTP, unlike the classic one.
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    environment:
      PROTOCOL: http
    ports:
      - "8081:8081"

  otel-collector:
    # Contrib, not core: core ships a narrow set of components and the
    # processors worth having locally are only in contrib.
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      # Only the collector binds these on the host. Jaeger speaks OTLP on the
      # same port, so exposing both would be a conflict and a question about
      # which one a service was actually reaching.
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    # Jaeger v2: one binary, OTLP in, and the UI on 16686.
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"

volumes:
  pgdata:
  redisdata:
  mongodata:
  qdrantdata:
  azuritedata:
