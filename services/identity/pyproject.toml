[project]
name = "identity"
version = "0.1.0"
description = "identity service"
requires-python = ">=3.12,<3.15"
dependencies = [
    "base[server,sql,postgres,auth,redis]",
]

[project.scripts]
serve = "identity.app:start"

# This service runs PostgreSQL in production and SQLite only locally, so
# SQLite is a dev dependency. A service that runs SQLite in production
# declares base[sqlite] above instead.
[dependency-groups]
dev = ["base[sqlite]"]

[tool.uv.sources]
base = { workspace = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# Slice metadata. `tools/new_service.py --from identity` composes this service's
# routers, models and stores into a new service. Paths are not listed: every
# module in the package travels except the composition roots the generator
# rewrites (app.py, settings.py, messaging.py, declarative root), so a file
# added here is part of the slice automatically.
[tool.starter.slice]
summary = "Authentication — signup, login, OAuth, token issuance and user records."
mixins = ["TokenIssuingMixin", "OAuthSettingsMixin", "IdpResourceServerMixin"]
extras = ["auth"]
publishes_events = true
