[project]
name = "ingestion_worker"
version = "0.1.0"
description = "Consumes domain events with a durable inbox"
requires-python = ">=3.12,<3.15"
dependencies = [
    "base[redis,sql,postgres]",
    "contracts",
]

[project.scripts]
serve = "ingestion_worker.worker:start"

# This service runs PostgreSQL in production and SQLite only locally, so
# SQLite is a dev dependency. A service that runs SQLite in production
# declares base[sqlite] above instead.
[dependency-groups]
dev = ["base[sqlite]"]

[tool.uv.sources]
base = { workspace = true }
contracts = { workspace = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# Slice metadata — see services/identity/pyproject.toml for the contract.
# This slice has no HTTP surface; composing it adds a durable inbox consumer.
[tool.starter.slice]
summary = "Event ingestion — durable inbox consumer for domain events."
mixins = []
extras = []
publishes_events = false
http = false
