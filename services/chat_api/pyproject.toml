[project]
name = "chat_api"
version = "0.1.0"
description = "Chat API service — conversations, messages, users and auth"
requires-python = ">=3.12,<3.15"
dependencies = [
    "base[server,sql,postgres,auth,openai,tokenizer,redis,sse]",
]

[project.scripts]
serve = "chat_api.app:start"

# This service runs PostgreSQL in production and SQLite only locally, so
# SQLite is a dev dependency. A service that runs SQLite in production
# declares base[sqlite] above instead.
[dependency-groups]
dev = ["base[sqlite]"]

[tool.uv.sources]
base = { workspace = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# Slice metadata — see services/identity/pyproject.toml for the contract.
[tool.starter.slice]
summary = "Conversations — chat, agents, prompts, chat history and log streaming."
mixins = ["LLMSettingsMixin", "PromptSettingsMixin"]
extras = ["openai", "tokenizer", "sse"]
publishes_events = true

[[tool.starter.slice.capabilities]]
imports = [
    "from base.capabilities.terminal_capture import TerminalCapture",
]
expr = "TerminalCapture(settings.service_name)"

[[tool.starter.slice.capabilities]]
imports = [
    "from base.capabilities.prompts import Prompts",
    "from {pkg}.prompts import templates",
    "from {pkg}.stores.prompt import PromptStore",
]
expr = "Prompts(templates=[templates], store=PromptStore())"

[[tool.starter.slice.lifespans]]
import = "from {pkg}.lifespans import background_tasks_lifespan"
expr = "background_tasks_lifespan"
