# Workspace root. Coordination only — this is not an installable package.
# Runtime dependencies belong to the packages under `packages/` and `services/`.

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv]
default-groups = "all"

[dependency-groups]
dev = [
    "pre-commit>=2.16.0",
    "pre-commit-hooks>=4.1.0",
    "ruff>=0.15.4,<0.16",
]

[tool.ruff]
# Workspace members live outside the root, so list them as import roots to keep
# isort's first-party detection working from any file in the repository.
src = [".", "packages/base", "packages/contracts", "services/chat_api", "services/identity", "services/ingestion_worker"]
lint.ignore = ["E501"]
lint.extend-select = ["I"]
