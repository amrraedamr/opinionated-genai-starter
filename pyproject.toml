[project]
name = "base"
version = "0.1.0"
description = "Opinionated FastAPI GenAI starter"
authors = [{ name = "Amr Amr", email = "amr.amr2391@gmail.com" }]
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.133.1,<0.134",
    "uvicorn[standard]>=0.41.0,<0.42",
    "pyhumps>=3.8.0,<4",
    "alembic>=1.18.4,<2",
    "sqlalchemy>=2.0.47,<3",
    "sqlalchemy-utils>=0.42.1,<0.43",
    "pyjwt>=2.11.0,<3",
    "openai>=2.24.0,<3",
    "argon2-cffi>=25.1.0,<26",
    "pydantic[email]>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "cryptography>=46.0.5,<47",
    "sse-starlette>=3.2.0,<4",
    "httpx[http2]>=0.28.1,<0.29",
    "requests>=2.32.5,<3",
    "redis>=7.2.1,<8",
    "certifi>=2026.2.25,<2027",
    "gunicorn>=25.1.0,<26",
    "pymysql>=1.1.2,<2",
    "psycopg2-binary>=2.9.11,<3",
    "aiosqlite>=0.22.1,<0.23",
    "aiomysql>=0.3.2,<0.4",
    "asyncpg>=0.31.0,<0.32",
    "azure-keyvault-secrets>=4.10.0,<5",
    "azure-identity>=1.25.2,<2",
    "azure-storage-blob>=12.28.0,<13",
    "pymongo>=4.16.0,<5",
    "qdrant-client>=1.17.0,<2",
    "azure-search-documents>=11.6.0,<12",
    "colorlog>=6.10.1,<7",
    "greenlet>=3.3.2,<4",
    "azure-cosmos>=4.15.0,<5",
    "aiohttp>=3.13.3,<4",
    "tiktoken>=0.12.0,<0.13",
]

[project.scripts]
api = "base:start"

[dependency-groups]
dev = [
    "pre-commit>=2.16.0",
    "pre-commit-hooks>=4.1.0",
    "ruff>=0.15.4,<0.16",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
lint.ignore = ["E501"]
lint.extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
