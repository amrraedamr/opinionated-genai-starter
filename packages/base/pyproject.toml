[project]
name = "base"
version = "0.1.0"
description = "Opinionated FastAPI GenAI foundation library"
authors = [{ name = "Amr Amr", email = "amr.amr2391@gmail.com" }]
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Core only: what every deployable needs regardless of shape. Everything else
# is an extra, so a worker that needs Redis and an LLM does not also install
# Qdrant, Cosmos, Azure Search, MySQL and Postgres. Each optional import site
# is guarded and raises MissingExtraError naming the extra to add.
#
# FastAPI is not core: a queue worker serves no HTTP. It belongs to `server`
# alongside the ASGI runners, which keeps Starlette out of worker images too.
dependencies = [
    "pydantic[email]>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "httpx[http2]>=0.28.1,<0.29",
    "requests>=2.32.5,<3",
    "aiohttp>=3.13.2,<4",
    "pyhumps>=3.8.0,<4",
    "colorlog>=6.10.1,<7",
    "contracts",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.133.1,<0.134",
    "uvicorn[standard]>=0.41.0,<0.42",
    "gunicorn>=25.1.0,<26",
    "python-multipart>=0.0.33,<0.1",
]
sql = [
    "sqlalchemy>=2.0.47,<3",
    "alembic>=1.18.4,<2",
    "sqlalchemy-utils>=0.42.1,<0.43",
    "greenlet>=3.3.2,<4",
]
sqlite = ["aiosqlite>=0.22.1,<0.23"]
postgres = [
    "asyncpg>=0.31.0,<0.32",
    "psycopg2-binary>=2.9.11,<3",
]
mysql = [
    "aiomysql>=0.3.2,<0.4",
    "pymysql>=1.1.2,<2",
]
auth = [
    "pyjwt>=2.11.0,<3",
    "argon2-cffi>=25.1.0,<26",
    "cryptography>=46.0.5,<47",
]
openai = ["openai>=2.24.0,<3"]
anthropic = ["anthropic>=2.4.0,<3"]
gemini = ["google-genai>=2.34.0,<3"]
tokenizer = ["tiktoken>=0.12.0,<0.13"]
# Tools described by raw JSON Schema, such as an MCP server's.
tools = ["jsonschema>=4.26.0,<5"]
# Tracing. The instrumentation packages version separately from the core ones
# and ship as betas, which is how OpenTelemetry releases them.
otel = [
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp>=1.45.2,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
]
redis = ["redis>=7.2.1,<8"]
rerank = ["cohere>=7.3.1,<8"]
mongo = ["pymongo>=4.16.0,<5"]
vectors = ["qdrant-client>=1.17.0,<2"]
sse = ["sse-starlette>=3.2.0,<4"]
azure = [
    "azure-identity>=1.25.2,<2",
    "azure-keyvault-secrets>=4.10.0,<5",
    "azure-storage-blob>=12.28.0,<13",
    "azure-cosmos>=4.15.0,<5",
    "azure-search-documents>=11.6.0,<12",
]

[project.scripts]
broker-ops = "base.tools.broker_cli:main"

[tool.uv.sources]
contracts = { workspace = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
